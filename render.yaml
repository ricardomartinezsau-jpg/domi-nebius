# Blueprint de Render para Domi
# Define la base de datos PostgreSQL, la aplicación web Next.js y el servicio de Render Workflows.

services:
  - type: web
    name: domi-web
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: domi-db
          property: connectionString
      - key: NEBIUS_API_KEY
        sync: false
      - key: LINKUP_API_KEY
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKFLOW_SLUG
        value: domi-research

  - type: workflow
    name: domi-research
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: domi-db
          property: connectionString
      - key: NEBIUS_API_KEY
        sync: false
      - key: LINKUP_API_KEY
        sync: false
      - key: RENDER_SDK_AUTO_START
        value: "true"

databases:
  - name: domi-db
    plan: starter
    databaseName: domi
    user: domi
